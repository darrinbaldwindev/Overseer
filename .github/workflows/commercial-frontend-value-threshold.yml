name: Commercial Frontend value-threshold validation

on:
  pull_request:
    paths:
      - 'tools/commercial_frontend/tradie_value_threshold.py'
      - 'tests/test_tradie_value_threshold.py'
      - '.github/workflows/commercial-frontend-value-threshold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python tests/test_tradie_value_threshold.py
